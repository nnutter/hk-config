name: update-hk

# The package pins exactly one hk version, so follow upstream instead of
# waiting for someone to notice. Update the pin, let the pull request checks
# decide, and only then tag and release: scripts/update-hk names the package
# version to tag, which is the hk version plus the next revision.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-hk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          # scripts/update-hk counts the release tags of an hk version, and a
          # shallow clone carries no tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Find the latest hk release
        id: hk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/jdx/hk/releases/latest --jq .tag_name)
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"
          echo "latest hk release: $tag"
      - name: Read the hk version this package pins
        id: pinned
        run: |
          version=$(sed -n 's|^amends "package://github.com/jdx/hk/releases/download/v\([^/]*\)/hk@.*|\1|p' Config.pkl)
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Stop unless hk released something new
        if: steps.hk.outputs.version == steps.pinned.outputs.version
        run: echo "hk ${{ steps.pinned.outputs.version }} is already pinned"
      - name: Update the pin
        id: package
        if: steps.hk.outputs.version != steps.pinned.outputs.version
        run: |
          version=$(scripts/update-hk "${{ steps.hk.outputs.version }}")
          echo "version=$version" >>"$GITHUB_OUTPUT"
      # GITHUB_TOKEN cannot open a pull request in this repository, and the
      # events it starts create no workflow run, so the required check would
      # never report. An app token is attributed to the app, which starts the
      # pull request checks and keeps the change out of the ruleset's extra
      # approval for unattributed changes.
      - name: Mint an app token
        id: app
        if: steps.package.outputs.version != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open the pull request with auto-merge
        id: pr
        if: steps.package.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          HK_VERSION: ${{ steps.hk.outputs.version }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          branch=update-hk
          # The app's own bot user authors the commit, so the change is
          # attributed to a real account.
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "$user_id+${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -am "Update hk to v$HK_VERSION"
          git push --force \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
            "HEAD:refs/heads/$branch"
          # A left-over pull request from an earlier run is reused, so the
          # daily run does not fail on its own history.
          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [[ -z $pr ]]; then
            gh pr create \
              --base master \
              --head "$branch" \
              --title "Update hk to v$HK_VERSION" \
              --body "hk v$HK_VERSION is the latest release. This updates the schema pin, the builtins import, and the hk tool pin. Auto-merge is on; when it merges, this workflow tags the package v$VERSION and starts the release."
            pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          fi
          gh pr merge "$pr" --auto --squash --delete-branch
          echo "number=$pr" >>"$GITHUB_OUTPUT"
      - name: Tag the merged commit
        if: steps.package.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.package.outputs.version }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          # Auto-merge waits for the pull request checks. Hold this job until
          # GitHub merges, so the tag lands on the commit CI approved. A
          # transient API error must not end the wait, so a failed call keeps
          # the last known state and the loop asks again.
          state=OPEN
          for _ in {1..90}; do
            next=$(gh pr view "$PR" --json state --jq .state) || next=$state
            state=$next
            [[ $state == MERGED ]] && break
            [[ $state == CLOSED ]] && break
            sleep 20
          done
          if [[ $state != MERGED ]]; then
            echo "pull request $PR is $state, so nothing was tagged" >&2
            exit 1
          fi
          tag="v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists, so there is nothing to release"
            exit 0
          fi
          sha=$(gh pr view "$PR" --json mergeCommit --jq .mergeCommit.oid)
          # The app token starts the release workflow with this tag push. A tag
          # made with GITHUB_TOKEN would start nothing, which is why the tag
          # does not use the workflow token.
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" \
            -f sha="$sha"
