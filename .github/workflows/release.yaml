name: release

# Pkl resolves a package URL by fetching the metadata asset (name@version, no
# extension) and then the zip that the metadata's packageZipUrl points at, so
# both files that `pkl project package` writes must be release assets.
on:
  push:
    tags: ["v[0-9]+.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yaml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      # The tag names the release and the package version, so a tag that is not
      # a version must not reach the upload.
      - name: Derive the package version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>"
            exit 1
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"
      # Re-runs the checks and the package tests against the release version,
      # then writes the artifacts that get uploaded.
      - run: mise run check
      - run: mise run package
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
