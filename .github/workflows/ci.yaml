name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      # Formatting, the hk schema check under the real hk binary, the `tests`
      # blocks inside each builtin, and the package tests, which build the
      # package and resolve it the way a consumer does.
      - run: mise run check
