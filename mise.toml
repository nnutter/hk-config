[settings]
# A release waits a week before mise installs it, so a compromised release
# cannot reach every machine that installs the tools of this repository.
minimum_release_age = "7d"

[tools]
# keep in sync with the hk version pinned in Config.pkl
hk = "2.11.1"
pkl = "latest"
uv = "latest"
go = "latest"
"github:googleapis/api-linter" = "latest"
"github:kojah/gohawk" = "latest"
"github:nnutter/constable" = "latest"
"github:securego/gosec" = "latest"
"github:nnutter/timber" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"github:nnutter/mdlint" = "latest"
"pypi:agentskills-tools" = "latest"
jactionlint = "latest"
betterleaks = "latest"
gofumpt = "latest"
buf = "latest"
shellcheck = "latest"
ruff = "latest"
ty = "latest"

[tasks.setup]
description = "Install hk's git hooks in this checkout"
run = "hk install"

[tasks.check]
description = "Validate the config, then run hk's checks and the package tests"
run = [
  # ty resolves `pytest` from the project environment, so it must exist first.
  "uv sync --locked",
  "hk validate",
  "hk check --all",
  "uv run pytest",
]

[tasks.fix]
description = "Run hk's fixes over every file"
run = "hk fix --all"

[tasks.upgrade]
description = "Upgrade the tools to their newest releases"
run = [
  "mise upgrade",
  # The tools of this repository wait for the age of the setting, so they
  # need the age of zero to leave the queue.
  "mise upgrade --minimum-release-age 0 github:nnutter/timber@latest",
  "mise upgrade --minimum-release-age 0 github:nnutter/constable@latest",
  "mise upgrade --minimum-release-age 0 github:nnutter/mdlint@latest",
]

[tasks.package]
description = "Build the Pkl package into dist/"
run = "pkl project package --output-path dist"

[tasks.bump]
description = "Bump the build version"
run = [
  "git tag v$(./scripts/update-hk)",
  "git push origin $(git describe --tags)",
]
