[settings]
# A release waits a week before mise installs it, so a compromised release
# cannot reach every machine that installs the tools of this repository.
minimum_release_age = "7d"

[tools]
# keep in sync with the hk version pinned in Config.pkl
hk = "2.14.0"
"github:googleapis/api-linter" = "latest"
# The release binary of gohawk reads the export data of an older Go, and the
# Go of this repository writes a newer format, so gohawk is built from source.
"go:github.com/kojah/gohawk" = "latest"
"github:nnutter/constable" = { version = "latest", "minimum_release_age" = "0" }
"github:nnutter/mdlint" = { version = "latest", "minimum_release_age" = "0" }
"github:nnutter/timber" = { version = "latest", "minimum_release_age" = "0" }
"github:securego/gosec" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"pypi:agentskills-tools" = "latest"
betterleaks = "latest"
buf = "latest"
go = "latest"
gofumpt = "latest"
jactionlint = "latest"
pkl = "latest"
python = "3.14"
ruff = "latest"
shellcheck = "latest"
ty = "latest"
uv = "latest"

[tasks.setup]
description = "Install hk's git hooks in this checkout"
run = "hk install"

[tasks.check]
description = "Validate the config, then run hk's checks and the package tests"
run = [
  # ty resolves `pytest` from the project environment, so it must exist first.
  "uv sync --locked",
  "hk validate",
  "hk check --all",
  "uv run pytest",
]

[tasks.fix]
description = "Run hk's fixes over every file"
run = "hk fix --all"

[tasks.upgrade]
description = "Upgrade the tools to their newest releases"
run = ["mise upgrade", "mise lock"]

[tasks.package]
description = "Build the Pkl package into dist/"
run = "pkl project package --output-path dist"

[tasks.bump]
description = "Bump the build version"
run = [
  "git tag v$(./scripts/update-hk)",
  "git push origin $(git describe --tags)",
]
