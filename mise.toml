[tools]
hk = "2.10.0"  # keep in sync with the hk version pinned in Config.pkl
pkl = "latest"
uv = "latest"
go = "latest"
"go:github.com/alecthomas/go-check-sumtype/cmd/go-check-sumtype" = "latest"
"go:github.com/kojah/gohawk" = "latest"
"go:github.com/nnutter/constable/cmd/constable" = "latest"
# Pinned rather than latest: the fork has one pseudo-version, and mise's
# minimum_release_age hides a release for 24 hours after it appears.
"go:github.com/nnutter/testifylint" = "0.0.0-20261101203540-577bf922d916"
"go:github.com/securego/gosec/v2/cmd/gosec" = "latest"
"go:go.uber.org/nilaway/cmd/nilaway" = "latest"
"go:github.com/nnutter/timber" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"github:nnutter/mdlint" = "latest"
jactionlint = "latest"
shellcheck = "latest"
ruff = "latest"
ty = "latest"

[tasks.setup]
description = "Install hk's git hooks in this checkout"
run = "hk install"

[tasks.check]
description = "Validate the config, then run hk's checks and the package tests"
run = [
  # ty resolves `pytest` from the project environment, so it must exist first.
  "uv sync --locked",
  "hk validate",
  "hk check --all",
  "uv run pytest",
]

[tasks.fix]
description = "Run hk's fixes over every file"
run = "hk fix --all"

[tasks.package]
description = "Build the Pkl package into dist/"
run = "pkl project package --output-path dist"
